name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  STYLUA_VERSION: "2.0.2"
  SELENE_VERSION: "0.28.0"
  ROJO_VERSION: "7.4.4"
  LUAU_VERSION: "0.650"
  LUNE_VERSION: "0.8.9"

jobs:
  lint:
    name: Lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (pinned release binaries)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          cd "$HOME/bin"
          curl -sSfL -o stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          curl -sSfL -o selene.zip "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          curl -sSfL -o rojo.zip "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          curl -sSfL -o luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          curl -sSfL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          for f in *.zip; do unzip -o -q "$f"; done
          chmod +x stylua selene rojo luau lune
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: StyLua format check
        run: stylua --check src tests

      - name: Generate Roblox std for selene
        run: selene generate-roblox-std

      - name: Selene lint
        run: |
          selene src
          selene --config tests/selene.toml tests

      - name: Offline unit tests (config, jump math, layouts)
        run: luau tests/run.luau

      - name: Rojo build
        run: |
          mkdir -p build
          rojo build default.project.json -o build/DontLookBackstage.rbxl

      - name: Runtime smoke test (Lune runs the real server modules)
        run: lune run tests/smoke/run build/DontLookBackstage.rbxl
